user  nginx;
load_module modules/ngx_http_geoip2_module.so;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 📍 Load GeoIP2 database
    geoip2 /etc/nginx/GeoLite2-City.mmdb {
        $geoip2_city_name city names en;
        $geoip2_country_name country names en;
        $geoip2_continent_name continent names en;
    }

    #  Enhanced log format with browser, timing, and geo info
    log_format ip_activity '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'country=$geoip2_country_name city=$geoip2_city_name continent=$geoip2_continent_name '
                           'rt=$request_time';

    access_log /var/log/nginx/access.log ip_activity;

    #  Trust X-Real-IP header (for reverse proxy setups)
    real_ip_header X-Real-IP;
    set_real_ip_from 0.0.0.0/0;

    # Include custom rule files (generated dynamically by Node)
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;

        #  Include IP block/allow rules
        include /etc/nginx/conf.d/ip-rules.conf;

        #  Route traffic to different internal services
        location /site1/ {
            proxy_pass http://site1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /site2/ {
            proxy_pass http://site2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Node API runs behind Nginx under /api/
        location /api/ {
            proxy_pass http://ip_manager:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #  Health check endpoint
        location /_health {
            return 200 "ok\n";
        }
    }
}
